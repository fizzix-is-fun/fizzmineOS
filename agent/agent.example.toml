# /etc/fizzmine/agent.toml on each rig. install-rig.sh writes this for you.
rig = "babyarm"                       # name shown on the dashboard (defaults to the hostname)
hub_url = "ws://192.168.1.50:8780"    # where the hub runs
token = "change-me"                   # written by install-rig.sh when the rig enrolls
interval_s = 5
wildrig_api_port = 60050              # add `--api-port 60050` to the wildrig command in /usr/local/bin/mine
