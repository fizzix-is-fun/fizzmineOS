<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miner console</title>
<style>
  :root { --bg:#0b0d10; --panel:#181b22; --line:#2a2f3a; --text:#d8dbe0; --quiet:#8b93a3; --good:#3ecf8e; --bad:#f05252; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:8px 16px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--good); }
  #status { color:var(--quiet); font-size:12px; }
  label { color:var(--quiet); font-size:12px; margin-left:auto; display:flex; gap:4px; align-items:center; }
  pre { flex:1; margin:0; padding:10px 16px; overflow:auto; font:12.5px/1.35 ui-monospace, Menlo, Consolas, monospace; white-space:pre-wrap; word-break:break-all; }
  /* the 16 terminal colors, readable on a dark background */
  .c30{color:#6b7280}.c31{color:#f87171}.c32{color:#4ade80}.c33{color:#facc15}.c34{color:#60a5fa}.c35{color:#e879f9}.c36{color:#22d3ee}.c37{color:#e5e7eb}
  .c90{color:#9ca3af}.c91{color:#fca5a5}.c92{color:#86efac}.c93{color:#fde68a}.c94{color:#93c5fd}.c95{color:#f0abfc}.c96{color:#67e8f9}.c97{color:#fff}
  .bold{font-weight:700}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1 id="title">Miner console</h1>
  <span id="status">connecting…</span>
  <label><input type="checkbox" id="follow" checked> follow</label>
</header>
<pre id="out"></pre>
<script>
const rig = new URLSearchParams(location.search).get('rig') || '';
const out = document.getElementById('out'), status = document.getElementById('status'), dot = document.getElementById('dot');
const follow = document.getElementById('follow');
const MAX_CHUNKS = 1500;  // keep the page light; the oldest output drops off the top
document.title = `${rig} miner`;
document.getElementById('title').textContent = `${rig} · miner`;

const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));

// terminal colour codes (ESC[..m) to spans; other escape codes are dropped
let open = '';
function ansi(text) {
  let html = open ? `<span class="${open}">` : '';
  const parts = text.split(/\x1b\[([0-9;]*)([A-Za-z])/);
  for (let i = 0; i < parts.length; i += 3) {
    html += esc(parts[i]);
    if (i + 2 >= parts.length || parts[i + 2] !== 'm') continue;
    let cls = open.split(' ').filter(Boolean);
    for (const n of (parts[i + 1] || '0').split(';').map(Number)) {
      if (n === 0) cls = [];
      else if (n === 1) cls.push('bold');
      else if ((n >= 30 && n <= 37) || (n >= 90 && n <= 97)) cls = cls.filter(c => c === 'bold').concat('c' + n);
      else if (n === 39) cls = cls.filter(c => c === 'bold');
    }
    if (open) html += '</span>';
    open = cls.join(' ');
    if (open) html += `<span class="${open}">`;
  }
  return html + (open ? '</span>' : '');
}

let offset = null, stopped = false;
async function poll() {
  try {
    const r = await fetch(`/api/rigs/${encodeURIComponent(rig)}/log` + (offset == null ? '' : `?offset=${offset}`));
    if (r.status === 401) { status.textContent = 'log in on the dashboard first, then reload'; return; }
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    offset = d.offset;
    dot.classList.toggle('on', d.running);
    status.textContent = d.running ? 'miner running' : 'miner stopped';
    if (d.text) {
      // progress lines rewrite themselves with \r; show each as its own line
      const chunk = document.createElement('span');
      chunk.innerHTML = ansi(d.text.replace(/\r\n/g, '\n').replace(/\r/g, '\n'));
      out.appendChild(chunk);
      while (out.childNodes.length > MAX_CHUNKS) out.firstChild.remove();
      if (follow.checked) out.scrollTop = out.scrollHeight;
    }
  } catch (e) {
    dot.classList.remove('on');
    status.textContent = `can't reach ${rig}: ${e.message}`;
  }
  setTimeout(poll, document.hidden ? 5000 : 1500);
}
// scrolling up pauses following; scrolling back to the bottom resumes it
out.addEventListener('scroll', () => { follow.checked = out.scrollHeight - out.scrollTop - out.clientHeight < 40; });
poll();
</script>
</body>
</html>
