<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fizzmineOS</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e6e8ec; --quiet:#8b93a3; --good:#3ecf8e; --warn:#f5a524; --bad:#f05252; --accent:#5aa9ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; align-items:baseline; gap:16px; padding:16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  .totals { color:var(--quiet); }
  .totals b { color:var(--text); }
  main { padding:16px; display:grid; gap:16px; }
  .rig { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; overflow-x:auto; }
  .rig-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .rig-head h2 { font-size:16px; margin:0; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--good); }
  .mode { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--quiet); }
  .mode.mining { color:var(--accent); border-color:var(--accent); }
  .stat { color:var(--quiet); }
  .stat b { color:var(--text); }
  table { border-collapse:collapse; width:100%; min-width:640px; }
  th, td { text-align:right; padding:6px 8px; border-top:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--quiet); font-weight:500; font-size:12px; }
  .off { color:var(--quiet); }
  .hot { color:var(--warn); } .very-hot { color:var(--bad); }
  svg.spark { width:100%; height:40px; margin-top:8px; display:block; }
  .empty { color:var(--quiet); }
  @media (max-width: 600px) { table { min-width:0; } .wide { display:none; } th, td { padding:6px 4px; } }
</style>
</head>
<body>
<header>
  <h1>fizzmineOS</h1>
  <span class="totals" id="totals"></span>
</header>
<main id="rigs"><p class="empty">Loading…</p></main>
<script>
const fmt = (v, d = 0) => v == null ? '–' : Number(v).toFixed(d);
const ths = hs => hs == null ? '–' : (hs / 1e12).toFixed(1) + ' TH/s';
const offset = o => o ? ` <span class="off">(${o > 0 ? '+' : ''}${o})</span>` : '';
const tempClass = t => t >= 80 ? 'very-hot' : t >= 72 ? 'hot' : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function spark(points) {
  const vals = points.map(p => p.hashrate_hs ?? 0);
  if (vals.length < 2 || Math.max(...vals) === 0) return '';
  const max = Math.max(...vals), n = vals.length - 1;
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${(i / n * 1000).toFixed(1)} ${(38 - v / max * 34).toFixed(1)}`).join('');
  return `<svg class="spark" viewBox="0 0 1000 40" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function rigCard(r, hist) {
  const m = r.miner || {}, power = r.gpus.reduce((s, g) => s + (g.power_w || 0), 0);
  const mining = r.online && m.running;
  const eff = mining && power ? (m.hashrate_hs / 1e12 / power).toFixed(2) + ' TH/W' : '–';
  const rows = r.gpus.map((g, i) => `<tr>
    <td title="${g.vbios ? 'VBIOS ' + esc(g.vbios) : ''}">${g.index}: ${g.brand ? esc(g.brand) + ' ' : ''}${esc((g.name || '').replace(/^NVIDIA (GeForce )?/, ''))}</td>
    <td class="${tempClass(g.temp_c)}">${fmt(g.temp_c)} °C</td>
    <td>${fmt(g.fan_pct)} %</td>
    <td>${fmt(g.power_w)} / ${fmt(g.power_limit_w)} W</td>
    <td class="wide">${fmt(g.core_mhz)} MHz${offset(g.core_offset_mhz)}</td>
    <td class="wide">${fmt(g.mem_mhz)} MHz${offset(g.mem_offset_mhz)}</td>
    <td class="wide">${fmt(g.vram_used_mb / 1024, 1)} / ${fmt(g.vram_total_mb / 1024, 0)} GB</td>
    <td>${mining ? ths(g.hashrate_hs ?? (m.card_hashrate_hs || [])[i]) : '–'}</td>
    <td>${mining && g.shares_accepted != null ? `${g.shares_accepted} / ${g.shares_rejected ?? 0}` : '–'}</td></tr>`).join('');
  return `<section class="rig">
    <div class="rig-head">
      <span class="dot ${r.online ? 'on' : ''}" title="${r.online ? 'online' : 'offline'}"></span>
      <h2>${esc(r.rig)}</h2>
      <span class="mode ${mining ? 'mining' : ''}">${!r.online ? 'offline' : mining ? 'mining ' + esc(m.algo || '') : 'AI / idle'}</span>
      <span class="stat">Hashrate <b>${mining ? ths(m.hashrate_hs) : '–'}</b></span>
      <span class="stat">Power <b>${fmt(power)} W</b></span>
      <span class="stat">Efficiency <b>${eff}</b></span>
      <span class="stat">Shares <b>${m.running ? `${fmt(m.shares_accepted)} / ${fmt(m.shares_rejected)} rej` : '–'}</b></span>
    </div>
    ${r.gpus.length ? `<table><thead><tr><th>GPU</th><th>Temp</th><th>Fan</th><th>Power</th><th class="wide">Core</th><th class="wide">Mem</th><th class="wide">VRAM</th><th>Hashrate</th><th>Shares</th></tr></thead><tbody>${rows}</tbody></table>`
      : '<p class="empty">No reports yet. Install the agent on this rig.</p>'}
    ${spark(hist)}
  </section>`;
}

let history = {}, lastHist = 0;
async function refresh() {
  try {
    const rigs = await (await fetch('api/rigs')).json();
    if (Date.now() - lastHist > 60000) {
      lastHist = Date.now();
      await Promise.all(rigs.map(async r => { history[r.rig] = await (await fetch(`api/rigs/${encodeURIComponent(r.rig)}/history?hours=24`)).json(); }));
    }
    const live = rigs.filter(r => r.online);
    const hr = live.reduce((s, r) => s + (r.miner.running ? r.miner.hashrate_hs || 0 : 0), 0);
    const w = live.reduce((s, r) => s + r.gpus.reduce((a, g) => a + (g.power_w || 0), 0), 0);
    document.getElementById('totals').innerHTML = `${live.length}/${rigs.length} rigs online · <b>${ths(hr)}</b> · <b>${fmt(w)} W</b> GPU power`;
    document.getElementById('rigs').innerHTML = rigs.length ? rigs.map(r => rigCard(r, history[r.rig] || [])).join('') : '<p class="empty">No rigs in hub.toml yet.</p>';
  } catch (e) {
    document.getElementById('totals').textContent = 'Hub unreachable, retrying…';
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
