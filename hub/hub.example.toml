# Copy to hub/config/hub.toml (setup-hub.sh does this for you).
db = "/var/lib/fizzmine/hub.db"

# Rigs join with: curl -fsSL http://<hub>:8780/install.sh | sudo bash -s -- --key <enroll_key>
# Generate one with: openssl rand -hex 16
enroll_key = "change-me"

# Password for the dashboard. Leave it out to run without a login (not recommended once rigs can be controlled).
admin_password = "change-me"

# Optional: rigs set up by hand, name = token. Enrolled rigs don't need a line here.
[rigs]
